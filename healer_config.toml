# ═══════════════════════════════════════════════════════════════════════════
#  healer_config.toml — configuration for Orpheus Healer v2.0
#  Edit this file to match your own paths and preferences.
#  The script reloads it on every run.
# ═══════════════════════════════════════════════════════════════════════════

[paths]
# Path to the Soniq Tools CSV (File → Export → CSV)
soniq_csv     = 'heal_wave2_kuat.csv'

# Folder holding the FLACs, the one Soniq Tools analysed
music_folder  = 'G:\Music\Library'

# The OrpheusDL root, where orpheus.py sits
orpheus_dir   = 'D:\Project\College Project\music\OrpheusDL-master'

# Backup folder for the fake files, used when delete_fake_files = false
backup_folder = 'G:\Music\_FAKE_BACKUP'

# Log file, rotated automatically at 5MB × 3 files
log_file      = 'orpheus_healer_log.txt'


[settings]
# Pause between tracks in seconds, to stay under the rate limit
delay_between_downloads = 3

# true = delete the fake files, false = move them to backup_folder
delete_fake_files = false

# The Verdict column values that make a CSV row a candidate.
# These now hold the statuses from quality_probe.inspect() rather than Soniq's
# verdicts: the candidate CSV comes from scan_library.py, with path renamed to
# File and status to Verdict. Going back to a Soniq CSV means putting the Soniq
# verdict strings back here.
soniq_flags = [
    "suspect",
    "corrupt",
]

# The measured statuses that make a downloaded file unacceptable.
# Valid values: "suspect", "corrupt", "unknown".
# "unknown" is a bad idea: most files land in that category, including every
# AAC at 256 kbps and above, which simply cannot be proven either way.
redownload_status = ["suspect", "corrupt"]

# Metadata tags carried over from the original file to the new one
preserve_tags = [
    "comment",
    "rating",
    "fmps_rating",
    "fmps_playcount",
    "replaygain_track_gain",
    "replaygain_track_peak",
    "replaygain_album_gain",
    "replaygain_album_peak",
    "lyrics",
    "musicbrainz_trackid",
]


# ── SOURCE PRIORITY ──────────────────────────────────────────────────────────
# The order sources are tried in when a track is still fake after downloading.
# A module has to be installed under modules/ and logged in.
# Install: git clone <repo> modules/<name>
# Set enabled = true to turn one on.

[[source_priority]]
module  = "tidal"
label   = "Tidal HiFi"
enabled = true

[[source_priority]]
module  = "qobuz"
label   = "Qobuz"
enabled = false   # set true if you have a Qobuz account

[[source_priority]]
module  = "deezer"
label   = "Deezer HiFi"
enabled = false   # set true if you have a Deezer account

[[source_priority]]
module  = "applemusic"   # folder: modules/applemusic
label   = "Apple Music"
enabled = true

[[source_priority]]
module  = "amazon"
label   = "Amazon Music HD"
enabled = false
